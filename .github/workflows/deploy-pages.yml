name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar (base href /MedicalFarmacy/)
        run: npx ng build --base-href /MedicalFarmacy/

      - name: Preparar para SPA en GitHub Pages
        run: |
          cp dist/medical-shop/browser/index.html dist/medical-shop/browser/404.html
          touch dist/medical-shop/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/medical-shop/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
