<section class="login">
  <span class="login__icono" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="28" height="28">
      <rect
        x="5"
        y="11"
        width="14"
        height="10"
        rx="2.5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />
      <path
        d="M8 11V8a4 4 0 0 1 8 0v3"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </span>
  <h1 class="login__titulo">Ingreso administrador</h1>
  <p class="login__texto">Solo el administrador puede ver y finalizar pedidos.</p>

  <form (submit)="entrar($event)">
    <div class="campo">
      <label for="email">Correo</label>
      <div class="campo__control">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m4 7 8 6 8-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </div>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="campo__control">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect
            x="5"
            y="11"
            width="14"
            height="10"
            rx="2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M8 11V8a4 4 0 0 1 8 0v3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
      </div>
    </div>

    @if (error()) {
      <div class="login__error" role="alert">{{ error() }}</div>
    }

    <button type="submit" class="pub-boton pub-boton--bloque" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <a routerLink="/" class="pub-volver login__volver">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path
        d="M15 6l-6 6 6 6"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    Volver al catálogo
  </a>
</section>
