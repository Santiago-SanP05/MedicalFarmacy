<section class="card login">
  <span class="login__icono" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <rect
        x="5"
        y="11"
        width="14"
        height="10"
        rx="2.5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />
      <path
        d="M8 11V8a4 4 0 0 1 8 0v3"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </span>
  <h1 class="page-title">Ingreso administrador</h1>
  <p class="muted">Solo el administrador puede ver y finalizar pedidos.</p>

  <form (submit)="entrar($event)">
    <div class="field">
      <label for="email">Correo</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <a routerLink="/" class="volver">← Volver al catálogo</a>
</section>
