<section class="card login">
  <h1 class="page-title">Ingreso administrador</h1>
  <p class="muted">Solo el administrador puede ver y finalizar pedidos.</p>

  <form (submit)="entrar($event)">
    <div class="field">
      <label for="email">Correo</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <a routerLink="/" class="volver">← Volver al catálogo</a>
</section>
