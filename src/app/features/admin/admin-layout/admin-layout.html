<div class="admin-bar">
  <nav aria-label="Administración">
    <a routerLink="/admin/pedidos" routerLinkActive="active">Pedidos</a>
    <a routerLink="/admin/productos" routerLinkActive="active">Inventario</a>
    <a routerLink="/admin/ganancias" routerLinkActive="active">Ganancias</a>
  </nav>
  <div class="admin-bar__sesion">
    @if (auth.sesion()?.user?.email; as correo) {
      <span class="correo">{{ correo }}</span>
    }
    <button type="button" class="pub-boton-sec pub-boton--sm" (click)="salir()">
      Cerrar sesión
    </button>
  </div>
</div>

<router-outlet />
