@if (enAdmin()) {
  <header class="topbar">
    <div class="topbar__accent"></div>
    <div class="container topbar__inner">
      <a routerLink="/" class="brand" aria-label="GERDMART, ir al catálogo">
        <span class="brand__mark">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M12 5v14M5 12h14"
              style="stroke: var(--on-color)"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span>GERD<strong>MART</strong></span>
      </a>
    </div>
  </header>

  <main class="container page">
    <router-outlet />
  </main>
} @else {
  <header class="navbar-flotante">
    <div class="navbar-pill">
      <a routerLink="/" class="brand-pub" aria-label="GERDMART, ir al catálogo">
        <span class="brand-pub__mark">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M12 5v14M5 12h14"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span class="brand-pub__texto">GERD<strong>MART</strong></span>
      </a>

      @if (enCatalogo()) {
        <div class="navbar-pill__buscador">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <line
              x1="21"
              y1="21"
              x2="16.65"
              y2="16.65"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <input
            type="search"
            placeholder="Buscar producto, marca o principio activo…"
            aria-label="Buscar producto"
            [value]="busqueda.texto()"
            (input)="busqueda.texto.set($any($event.target).value)"
          />
        </div>
      }

      <nav class="navbar-pill__nav">
        <a routerLink="/carrito" routerLinkActive="activo" class="cart-link-pub">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L19 8H6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="9" cy="19" r="1.4" fill="currentColor" />
            <circle cx="17" cy="19" r="1.4" fill="currentColor" />
          </svg>
          <span class="cart-link-pub__texto">Carrito</span>
          @if (carrito.cantidadTotal() > 0) {
            <span class="badge-pub" aria-label="{{ carrito.cantidadTotal() }} productos en el carrito">{{
              carrito.cantidadTotal()
            }}</span>
          }
        </a>
        <a routerLink="/admin/login" class="admin-link-pub">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container page page--flotante">
    <router-outlet />
  </main>
}
